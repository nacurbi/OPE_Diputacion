<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60 Aleatorias</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .pregunta .num-real {
            font-size: 14px;
            font-weight: normal;
            color: #6c757d;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">60 Aleatorias</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "¿En qué se constituye España según la Constitución?",
    "options": [
      "A - En un Estado federal y democrático.",
      "B - En un Estado social y democrático de Derecho.",
      "C - En una monarquía absolutista.",
      "D - En un Estado centralizado."
    ],
    "correct": 1
  },
  {
    "question": "¿Cuáles son los valores superiores del ordenamiento jurídico según la Constitución?",
    "options": [
      "A - Libertad, justicia, igualdad y pluralismo político.",
      "B - Igualdad, pluralismo político, seguridad y justicia.",
      "C - Democracia, igualdad, legalidad y libertad.",
      "D - Justicia, solidaridad, igualdad y legalidad."
    ],
    "correct": 0
  },
  {
    "question": "La forma política del Estado, según el artículo 1.3 de la Constitución, es:",
    "options": [
      "A - La república democrática.",
      "B - El Estado autonómico.",
      "C - La monarquía parlamentaria.",
      "D - La monarquía constitucional."
    ],
    "correct": 2
  },
  {
    "question": "¿De dónde emanan los poderes del Estado según la Constitución?",
    "options": [
      "A - De la Constitución.",
      "B - Del Rey.",
      "C - Del Gobierno.",
      "D - Del pueblo español."
    ],
    "correct": 3
  },
  {
    "question": "La Constitución reconoce y garantiza:",
    "options": [
      "A - El derecho de secesión de las nacionalidades.",
      "B - La autonomía de las nacionalidades y regiones que integran la Nación española.",
      "C - La independencia de las comunidades autónomas.",
      "D - La centralización administrativa del Estado."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, los partidos políticos:",
    "options": [
      "A - Sustituyen al Parlamento.",
      "B - Expresan el pluralismo político.",
      "C - Dirigen el poder judicial.",
      "D - Dependen del Gobierno."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, señale la respuesta correcta respecto a los sindicatos de trabajadores y las asociaciones empresariales:",
    "options": [
      "A - Contribuyen a la defensa y promoción de los intereses económicos y sociales que les son propios.",
      "B - Su creación debe ser autorizado por el Gobierno.",
      "C - El ejercicio de su actividad será controlado por el Senado.",
      "D - Su estructura interna y funcionamiento podrán ser democráticos."
    ],
    "correct": 0
  },
  {
    "question": "Según la Constitución, los ciudadanos y los poderes públicos:",
    "options": [
      "A - Están sujetos a la Constitución y al resto del ordenamiento jurídico, salvo las leyes orgánicas.",
      "B - Están sujetos a la Constitución y al resto del ordenamiento jurídico, salvo las leyes y los reglamentos.",
      "C - Están sujetos a la Constitución y al resto del ordenamiento jurídico, salvo los reglamentos.",
      "D - Están sujetos a la Constitución y al resto del ordenamiento jurídico."
    ],
    "correct": 3
  },
  {
    "question": "La Constitución garantiza:",
    "options": [
      "A - La arbitrariedad de los poderes públicos.",
      "B - La retroactividad de las normas sancionadoras no favorables o restrictivas de derechos individuales.",
      "C - La seguridad jurídica.",
      "D - El poder absoluto del Estado."
    ],
    "correct": 2
  },
  {
    "question": "La Constitución garantiza:",
    "options": [
      "A - El principio de legalidad.",
      "B - La horizontalidad normativa.",
      "C - La irretroactividad de las disposiciones sancionadoras favorables.",
      "D - La confidencialidad de las normas."
    ],
    "correct": 0
  },
  {
    "question": "Según la Constitución, ¿cómo se interpretarán las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce?",
    "options": [
      "A - De conformidad con la jurisprudencia del Tribunal Supremo.",
      "B - De conformidad con la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España.",
      "C - Únicamente según el criterio del Tribunal Constitucional.",
      "D - Según lo que dictaminen las Leyes Orgánicas que los desarrollen."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución la mayoría de edad se adquiere:",
    "options": [
      "A - A los dieciséis años.",
      "B - A los dieciocho años.",
      "C - A los veintiún años.",
      "D - Cuando lo determine el Código Civil para cada caso concreto."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de:",
    "options": [
      "A - Nacimiento, raza, sexo, religión o lengua.",
      "B - Nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.",
      "C - Nacionalidad, raza, sexo, religión u opinión política.",
      "D - Origen étnico, sexo, religión, convicciones o edad."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, todos tienen derecho a la vida y a la integridad física y moral, sin que, en ningún caso, puedan ser sometidos a:",
    "options": [
      "A - Penas de prisión superiores a treinta años.",
      "B - Pruebas biológicas.",
      "C - Trabajos forzados o esclavitud moderna.",
      "D - Tortura ni a penas o tratos inhumanos o degradantes."
    ],
    "correct": 3
  },
  {
    "question": "Según la Constitución, ¿qué establece el artículo 16.3 respecto a la confesión del Estado?",
    "options": [
      "A - Ninguna confesión tendrá carácter estatal.",
      "B - El Estado es católico por tradición histórica.",
      "C - El Estado cooperará únicamente con la Iglesia Católica.",
      "D - Los poderes públicos no tendrán en cuenta las creencias religiosas de la sociedad."
    ],
    "correct": 0
  },
  {
    "question": "Según la Constitución, la detención preventiva NO podrá durar más del tiempo estrictamente necesario para la realización de las averiguaciones tendentes al esclarecimiento de los hechos, y, en todo caso, en el plazo máximo de:",
    "options": [
      "A - Veinticuatro horas.",
      "B - Cuarenta y ocho horas.",
      "C - Setenta y dos horas.",
      "D - Cinco días naturales."
    ],
    "correct": 2
  },
  {
    "question": "Según la Constitución, ¿en qué casos se puede entrar o registrar un domicilio sin el consentimiento del titular?",
    "options": [
      "A - Por orden de la autoridad gubernativa o en caso de urgencia.",
      "B - En caso de flagrante delito o resolución judicial.",
      "C - Siempre que exista una investigación policial en curso.",
      "D - Solo mediante resolución judicial firme."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, ¿en qué supuesto se podrá acordar el secuestro de publicaciones, grabaciones y otros medios de información?",
    "options": [
      "A - Por decisión del Ministerio del Interior.",
      "B - Mediante resolución administrativa motivada.",
      "C - En virtud de resolución judicial.",
      "D - Cuando atenten contra la moral pública."
    ],
    "correct": 2
  },
  {
    "question": "Según la Constitución, en los casos de reuniones en lugares de tránsito público y manifestaciones, se dará comunicación previa a la autoridad, que sólo podrá prohibirlas cuando:",
    "options": [
      "A - Existan razones fundadas de alteración del orden público, con peligro para personas o bienes.",
      "B - El número de asistentes sea superior a 100 personas.",
      "C - Coincidan con un periodo de campaña electoral.",
      "D - Entorpezcan gravemente la circulación de vehículos."
    ],
    "correct": 0
  },
  {
    "question": "Según la Constitución, las asociaciones que persigan fines o utilicen medios tipificados como delito son:",
    "options": [
      "A - Sancionables administrativamente.",
      "B - Ilegales.",
      "C - Legales, aunque nulas de pleno derecho.",
      "D - Suspendibles por el Ministerio del Interior."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, los ciudadanos tienen derecho a acceder en condiciones de igualdad a las funciones y cargos públicos, con los requisitos que señalen:",
    "options": [
      "A - Los reglamentos de las Cámaras.",
      "B - Los Gobiernos autonómicos y locales.",
      "C - Las autoridades judiciales.",
      "D - Las leyes."
    ],
    "correct": 3
  },
  {
    "question": "Según la Constitución, las penas privativas de libertad y las medidas de seguridad estarán orientadas hacia:",
    "options": [
      "A - El castigo ejemplarizante y la retribución.",
      "B - El aislamiento del delincuente de la sociedad.",
      "C - La reparación del daño a la víctima.",
      "D - La reeducación y reinserción social."
    ],
    "correct": 3
  },
  {
    "question": "Según la Constitución, la enseñanza básica es:",
    "options": [
      "A - Obligatoria y gratuita.",
      "B - Gratuita hasta los doce años.",
      "C - Obligatoria hasta los catorce años.",
      "D - Obligatoria, gratuita y católica."
    ],
    "correct": 0
  },
  {
    "question": "Según la Constitución, se reconoce el derecho a la huelga de los trabajadores para la defensa de sus intereses. La ley que regule el ejercicio de este derecho establecerá las garantías precisas para asegurar:",
    "options": [
      "A - El derecho al trabajo de los no huelguistas.",
      "B - El mantenimiento de los servicios esenciales de la comunidad.",
      "C - La seguridad de las instalaciones productivas.",
      "D - El pago de los salarios durante el conflicto."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, todos contribuirán al sostenimiento de los gastos públicos de acuerdo con su capacidad económica mediante un sistema tributario justo inspirado en los principios de:",
    "options": [
      "A - Igualdad y proporcionalidad.",
      "B - Igualdad y progresividad.",
      "C - Solidaridad y eficiencia.",
      "D - Equidad y suficiencia."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, nadie podrá ser privado de sus bienes y derechos:",
    "options": [
      "A - Sino por causa justificada de utilidad pública o interés social mediante la correspondiente indemnización y de conformidad con lo dispuesto por las leyes.",
      "B - Salvo los bienes y derechos adquiridos mediante herencia.",
      "C - Salvo las personas mayores de 50 años sin menores dependientes.",
      "D - En ningún caso."
    ],
    "correct": 0
  },
  {
    "question": "Según la Constitución, los padres deben prestar asistencia de todo orden a los hijos habidos dentro o fuera del matrimonio:",
    "options": [
      "A - Hasta que alcancen la mayoría de edad.",
      "B - Mientras convivan en el domicilio familiar.",
      "C - Hasta que finalicen sus estudios superiores.",
      "D - Durante su minoría de edad y en los demás casos en que legalmente proceda."
    ],
    "correct": 3
  },
  {
    "question": "Según la Constitución, ¿qué aspecto deben garantizar los poderes públicos mediante la limitación de la jornada laboral y las vacaciones periódicas retribuidas?",
    "options": [
      "A - El derecho a la conciliación familiar y laboral.",
      "B - El incremento de la productividad nacional.",
      "C - El descanso necesario.",
      "D - La reducción de los accidentes de trabajo."
    ],
    "correct": 2
  },
  {
    "question": "Según la Constitución, se reconoce el derecho a la protección de la salud. Compete a los poderes públicos organizar y tutelar la salud pública a través de:",
    "options": [
      "A - La creación de hospitales públicos en cada municipio.",
      "B - El control de precios de los medicamentos.",
      "C - Medidas preventivas y de las prestaciones y servicios necesarios.",
      "D - La gestión directa de todos los centros sanitarios."
    ],
    "correct": 2
  },
  {
    "question": "Según la Constitución, todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como:",
    "options": [
      "A - El deber de conservarlo.",
      "B - El deber de denunciar a los infractores.",
      "C - El derecho a recibir indemnizaciones por contaminación.",
      "D - El deber de reciclar los residuos domésticos."
    ],
    "correct": 0
  },
  {
    "question": "Las Cortes Generales están formadas por:",
    "options": [
      "A - El Congreso de los Diputados, el Gobierno y el Tribunal Constitucional.",
      "B - El Congreso de los Diputados, el Senado y el Consejo General del Poder Judicial.",
      "C - El Congreso de los Diputados y el Gobierno.",
      "D - El Congreso de los Diputados y el Senado."
    ],
    "correct": 3
  },
  {
    "question": "Ejercen la potestad legislativa del Estado, aprueban sus Presupuestos, controlan la acción del Gobierno y tienen las demás competencias que les atribuya la Constitución:",
    "options": [
      "A - Las Cortes Generales.",
      "B - El Tribunal Constitucional y el Tribunal Supremo.",
      "C - Los partidos políticos de la oposición.",
      "D - Las Cortes Generales y el Tribunal Constitucional."
    ],
    "correct": 0
  },
  {
    "question": "Señale la respuesta correcta sobre el Congreso:",
    "options": [
      "A - Se compone de un mínimo de 300 y un máximo de 400 Diputados, elegidos por sufragio universal, libre, igual, directo y secreto, en los términos que establezca la ley.",
      "B - Es la Cámara de representación territorial.",
      "C - La circunscripción electoral es la comunidad autónoma.",
      "D - Es elegido por cinco años."
    ],
    "correct": 0
  },
  {
    "question": "Señale la respuesta correcta sobre el Senado:",
    "options": [
      "A - Se compone de un mínimo de 300 y un máximo de 400 Diputados, elegidos por sufragio universal, libre, igual, directo y secreto, en los términos que establezca la ley.",
      "B - Es la Cámara de representación territorial.",
      "C - La circunscripción electoral es la comunidad autónoma.",
      "D - Es elegido por cinco años."
    ],
    "correct": 1
  },
  {
    "question": "Según la Constitución, son leyes orgánicas:",
    "options": [
      "A - Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que regulan el procedimiento administrativo común y el régimen electoral general y las demás previstas en la Constitución.",
      "B - Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general y las demás previstas en la Constitución.",
      "C - Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general, las relativas a cuestiones medio ambientales y las demás previstas en la Constitución.",
      "D - Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las relativas a cuestiones medioambientales y las demás previstas en la Constitución."
    ],
    "correct": 1
  },
  {
    "question": "La aprobación, modificación o derogación de las leyes orgánicas:",
    "options": [
      "A - Exigirá mayoría simple del Congreso, en una votación final sobre el conjunto del proyecto.",
      "B - Exigirá mayoría simple del Senado, en una votación final sobre el conjunto del proyecto.",
      "C - Exigirá mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto.",
      "D - Exigirá mayoría absoluta del Senado, en una votación final sobre el conjunto del proyecto."
    ],
    "correct": 2
  },
  {
    "question": "Las Cortes Generales:",
    "options": [
      "A - Podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre materias determinadas no incluidas en el artículo 81 que recibirán el título de Decretos Legislativos.",
      "B - Podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre materias determinadas no incluidas en el artículo 81 que recibirán el título de Decretos-Leyes.",
      "C - Podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre cualquier materia que recibirán el título de Decretos Legislativos.",

            // Las ya usadas se guardan en el navegador (localStorage); al agotarse las 256, empieza una vuelta nueva.
            {
                const N = 60;
                const CLAVE = 'diputacion_60aleatorias_usadas';

                const mezclar = (arr) => {
                    const c = arr.slice();
                    for (let i = c.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [c[i], c[j]] = [c[j], c[i]];
                    }
                    return c;
                };
                const idDe = (q) => {
                    const t = q.question + '|' + q.options.join('|');
                    let h = 0;
                    for (let i = 0; i < t.length; i++) { h = (h * 31 + t.charCodeAt(i)) | 0; }
                    return String(h);
                };

                let usadas = [];
                try {
                    usadas = JSON.parse(localStorage.getItem(CLAVE)) || [];
                    if (!Array.isArray(usadas)) usadas = [];
                } catch (e) { usadas = []; }

                const setUsadas = new Set(usadas);
                const nuevas = mezclar(preguntas.filter(q => !setUsadas.has(idDe(q))));
                let elegidas;

                if (nuevas.length >= N) {
                    elegidas = nuevas.slice(0, N);
                    usadas = usadas.concat(elegidas.map(idDe));
                } else {
                    // Quedan pocas sin usar: se dan todas y se completa con otras ya usadas (vuelta nueva)
                    const yaUsadas = mezclar(preguntas.filter(q => setUsadas.has(idDe(q))));
                    const relleno = yaUsadas.slice(0, N - nuevas.length);
                    elegidas = nuevas.concat(relleno);
                    usadas = relleno.map(idDe);
                }

                try { localStorage.setItem(CLAVE, JSON.stringify(usadas)); } catch (e) { /* sin almacenamiento: solo aleatorio */ }

                preguntas = mezclar(elegidas);

                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

                if (removeClasses && removeClasses.length > 0) {

                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
