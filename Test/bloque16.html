<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 16 (215 - 228)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 16 <span class="rango-test">(215 - 228)</span></h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, se reconoce a todo el personal al servicio de las entidades del sector público vasco el derecho a:",

  {

  {
    "question": "Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, en los procesos de selección y provisión de puestos de trabajo que tengan asignado el perfil lingüístico C2 y cuya fecha de preceptividad se encuentre vencida, en caso de no acreditarse este por ninguna de las personas candidatas:",
    "options": [

    "correct": 0

  {
    "question": "Cuando la acreditación del perfil lingüístico asignado a un puesto de trabajo sea preceptiva:",
    "options": [

    "options": [

      "B - En perfiles simétricos, comprensión y expresión escrita y comprensión y expresión oral B2 entre el 11 % y el 15 %.",
      "C - En perfiles simétricos, comprensión y expresión escrita y comprensión y expresión oral C1 entre el 16 % y el 20 %.",

    "correct": 0
  },
  {
    "question": "Estarán exentos del cumplimiento del régimen general de preceptividad de los perfiles lingüísticos en relación con el puesto de trabajo del que son titulares:",
    "options": [
      "A - Las personas que superen la edad de 40 años al inicio de cada período de planificación en el que se asigne la fecha de preceptividad al puesto de trabajo del que son titulares, previa conformidad de la persona interesada.",
      "B - Las personas cuyo nivel de estudios realizados no alcanzara los de Bachiller Elemental, Educación General Básica o Educación Secundaria Obligatoria, ni otros que, en el futuro, pudieran sustituir a estos, prescindiendo de las equivalencias y convalidaciones que contemple el ordenamiento jurídico a otros fines respecto al Certificado de Escolaridad.",

      "D - Las personas que declaren carencia manifiesta y contrastada de las destrezas aptitudinales necesarias en el proceso de aprendizaje del idioma mediante los programas de formación y capacitación lingüística de personas adultas."
    ],
    "correct": 1
  },
  {
    "question": "¿Cuál es el objeto de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",
    "options": [
      "A - Establecer los principios generales que han de presidir la actuación de los poderes públicos y privados en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres exclusivamente en el ámbito laboral.",
      "B - Establecer los principios generales que han de presidir la actuación de los poderes públicos en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres en todos los ámbitos de la vida y, en particular, a promover el empoderamiento de las mujeres, su autonomía y el fortalecimiento de su posición social, económica y política al objeto de eliminar la desigualdad estructural y todas las formas de discriminación por razón de sexo, incluida la violencia machista contra las mujeres.",
      "C - Establecer los principios generales que han de presidir la actuación de los poderes públicos en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres en todos los ámbitos de la vida y, en particular, a promover el empoderamiento de las mujeres, su autonomía y el fortalecimiento de su posición social, económica y política al objeto de reducir la desigualdad estructural y todas las formas de discriminación por razón de sexo, incluida la violencia machista contra las mujeres.",
      "D - Establecer los principios generales que han de presidir la actuación de los poderes públicos y privados en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres en todos los ámbitos de la vida y, en particular, a promover el empoderamiento de las mujeres, su autonomía y el fortalecimiento de su posición social, económica y política al objeto de eliminar la desigualdad estructural y todas las formas de discriminación por razón de sexo, incluida la violencia machista contra las mujeres."
    ],
    "correct": 1
  },
  {
    "question": "¿Cuál es el fin último de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",
    "options": [
      "A - Lograr una sociedad igualitaria y libre de violencia machista en la que todas las personas sean libres, en el ámbito público, para desarrollar sus capacidades personales y tomar decisiones sin las limitaciones impuestas por los roles tradicionales en función del género, y en la que se tengan en cuenta, valoren y potencien por igual las distintas conductas, aspiraciones y necesidades de mujeres y hombres.",
      "B - Lograr una sociedad igualitaria y libre de violencia machista en la que todas las personas sean libres, en el ámbito privado, para desarrollar sus capacidades personales y tomar decisiones sin las limitaciones impuestas por los roles tradicionales en función del género, y en la que se tengan en cuenta, valoren y potencien por igual las distintas conductas, aspiraciones y necesidades de mujeres y hombres.",
      "C - Lograr una sociedad igualitaria y libre de violencia machista en la que todas las personas sean libres, tanto en el ámbito público como en el privado, para desarrollar sus capacidades personales y tomar decisiones sin las limitaciones impuestas por los roles tradicionales en función del género, y en la que se tengan en cuenta, valoren y potencien por igual las distintas conductas, aspiraciones y necesidades de mujeres y hombres.",
      "D - Lograr una reducción importante de la violencia machista y fomentar una sociedad igualitaria."
    ],
    "correct": 2
  },
  {
    "question": "La Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres es de aplicación:",
    "options": [
      "A - A todas las administraciones públicas vascas, con las salvedades que a lo largo de ella se establezcan.",
      "B - Solo al Gobierno Vasco.",
      "C - Solo a entidades privadas del País Vasco.",
      "D - Solo a los Ayuntamientos de la Comunidad Autónoma del País Vasco."
    ],
    "correct": 0
  },
  {
    "question": "Los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres son de aplicación:",
    "options": [
      "A - Únicamente a las administraciones públicas vascas con sus respectivas administraciones institucionales y demás entes instrumentales dependientes o adscritos a ellas.",
      "B - A todos los poderes públicos vascos.",
      "C - A todos los poderes públicos vascos, salvo el Parlamento Vasco y las Juntas generales de los territorios históricos.",
      "D - A todos los poderes públicos vascos, salvo el Ararteko y el Tribunal Vasco de Cuentas Públicas."
    ],
    "correct": 1
  },
  {
    "question": "A las entidades privadas que suscriban contratos o convenios de colaboración con los poderes públicos vascos:",
    "options": [
      "A - No les será exigible durante ningún momento el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, aunque se valorará su cumplimiento en el momento de suscribir los contratos o convenios de colaboración.",
      "B - Les será exigible en un plazo de tres años desde el inicio de su relación con el poder público correspondiente el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres.",
      "C - Les será exigible únicamente en el momento de la suscripción del contrato o convenio de colaboración el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres.",
      "D - Les será exigible durante el tiempo y materia sobre la que verse su relación con el poder público correspondiente el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres."
    ],
    "correct": 3
  },
  {
    "question": "¿Cuál de los siguientes NO es un principio general del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",
    "options": [
      "A - Igualdad de trato.",
      "B - Neutralidad institucional.",
      "C - Respeto a la diversidad y a la diferencia.",
      "D - Eliminación de roles y estereotipos en función del género."
    ],
    "correct": 1
  },
  {
    "question": "¿Cuál de los siguientes NO es un principio general del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",
    "options": [
      "A - Igualdad de trato.",
      "B - Igualdad de oportunidades.",
      "C - Prevención, atención y erradicación de la violencia machista contra las mujeres.",
      "D - Respeto a la homogeneidad y a la igualdad."
    ],
    "correct": 3
  },
  {
    "question": "De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, cuando una persona sea, haya sido o pudiera ser tratada de manera menos favorable que otra en situación análoga por razón de su sexo o de circunstancias directamente relacionadas con el sexo, como el embarazo o la maternidad:",
    "options": [
      "A - Existirá discriminación indirecta.",
      "B - Existirá discriminación indirecta, salvo que dicho acto jurídico, criterio o práctica resulte adecuada y necesaria, y pueda justificarse con criterios objetivos que no estén relacionados con el sexo.",
      "C - Existirá discriminación directa únicamente cuando se demuestre un perjuicio económico.",
      "D - Existirá discriminación directa."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${preguntaActual + 1}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
