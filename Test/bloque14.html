<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 14 (187 - 200)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 14 <span class="rango-test">(187 - 200)</span></h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Los Valores Éticos a los que han de ajustar su conducta profesional las y los empleados públicos forales son los siguientes:",
    "options": [
      "A - Integridad, ejemplaridad, honestidad y desinterés, parcialidad y subjetividad, excelencia profesional, eficiencia y respeto.",
      "B - Integridad, ejemplaridad, honestidad y desinterés, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto.",
      "C - Integridad, ejemplaridad, honestidad y desinterés, parcialidad y subjetividad, excelencia profesional y celeridad.",
      "D - Integridad, ejemplaridad, discreción y confidencialidad, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto."
    ],
    "correct": 1
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la integridad es:",
    "options": [
      "A - La razón existencial de la institución del empleo público foral, cuya actuación profesional debe estar alejada de influencias y orientaciones políticas o de otro carácter.",
      "B - Que el empleado público foral dirija sus actuaciones, de forma veraz y transparente, exclusivamente hacia el objetivo del pleno cumplimiento del interés público y de los intereses de la ciudadanía guipuzcoana en su conjunto.",
      "C - Un valor sustantivo para el servicio público, la buena gestión y el fortalecimiento de las instituciones forales.",
      "D - La conducta profesional del empleado público foral, que estará guiada por un comportamiento ejemplar, en tanto que las buenas prácticas de las y los empleados públicos favorecen el cambio de la cultura cívica y la interiorización social de las normas."
    ],
    "correct": 2
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la honestidad y desinterés consiste en:",
    "options": [
      "A - La razón existencial de la institución del empleo público foral, cuya actuación profesional debe estar alejada de influencias y orientaciones políticas o de otro carácter.",
      "B - Que el empleado público foral dirija sus actuaciones, de forma veraz y transparente, exclusivamente hacia el objetivo del pleno cumplimiento del interés público y de los intereses de la ciudadanía guipuzcoana en su conjunto.",
      "C - Un valor sustantivo para el servicio público, la buena gestión y el fortalecimiento de las instituciones forales.",
      "D - La conducta profesional del empleado público foral, que estará guiada por un comportamiento ejemplar, en tanto que las buenas prácticas de las y los empleados públicos favorecen el cambio de la cultura cívica y la interiorización social de las normas."
    ],
    "correct": 1
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la imparcialidad es:",
    "options": [
      "A - La razón existencial de la institución del empleo público foral, cuya actuación profesional debe estar alejada de influencias y orientaciones políticas o de otro carácter.",
      "B - Que el empleado público foral dirija sus actuaciones, de forma veraz y transparente, exclusivamente hacia el objetivo del pleno cumplimiento del interés público y de los intereses de la ciudadanía guipuzcoana en su conjunto.",
      "C - Un valor sustantivo para el servicio público, la buena gestión y el fortalecimiento de las instituciones forales.",
      "D - La conducta profesional del empleado público foral, que estará guiada por un comportamiento ejemplar, en tanto que las buenas prácticas de las y los empleados públicos favorecen el cambio de la cultura cívica y la interiorización social de las normas."
    ],
    "correct": 0
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la gestión de los recursos y la gestión económico-financiera de las y los empleados públicos forales estarán imbuidas por:",
    "options": [
      "A - La atención a la ciudadanía.",
      "B - La eficiencia.",
      "C - La transparencia.",
      "D - La celeridad en la toma de decisiones."
    ],
    "correct": 1
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la norma de conducta “en horas y espacios de trabajo, harán un uso razonable y ético de sus dispositivos móviles personales así como de las redes sociales o Internet para uso exclusivamente privado” corresponde al siguiente valor ético:",
    "options": [
      "A - Integridad.",
      "B - Ejemplaridad.",
      "C - Imparcialidad y objetividad.",
      "D - Respeto."
    ],
    "correct": 1
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la norma de conducta “las y los empleados públicos forales no aceptarán ningún regalo, invitación, viajes, comidas o compensación económica por impartición de conferencias o participación en medios de comunicación siempre que se trate de actividades vinculadas exclusivamente con el ejercicio de sus funciones propias de su puesto de trabajo” corresponde al siguiente valor ético:",
    "options": [
      "A - Ejemplaridad.",
      "B - Eficiencia.",
      "C - Excelencia profesional.",
      "D - Honestidad y desinterés."
    ],
    "correct": 3
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, los principios de buena gestión son los siguientes:",
    "options": [
      "A - Transparencia, apertura de datos, cultura de gestión e innovación, promoción del uso del euskera y responsabilidad profesional.",
      "B - Integridad, ejemplaridad, honestidad y desinterés, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto.",
      "C - Transparencia, integridad, cultura de gestión e innovación, promoción del uso del euskera y excelencia profesional.",
      "D - Integridad, ejemplaridad, discreción y confidencialidad, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto."
    ],
    "correct": 0
  },
  {
    "question": "Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, ¿cuál de las siguientes normas de actuación profesional en el ámbito de la buena gestión está relacionada con la responsabilidad profesional?",
    "options": [
      "A - Las y los empleados públicos forales desarrollarán en su actividad profesional una cultura de gestión que conlleve mayor implicación en los proyectos, creatividad e iniciativa, así como el impulso de prácticas de innovación en el ámbito de lo público.",
      "B - Las y los empleados públicos forales actuarán con especial diligencia garantizando respuestas rápidas, efectivas y motivadas, cuando se demande a la Administración Foral información pública por parte de la ciudadanía y de sus entidades, ponderando en cada caso los límites existentes, los derechos en juego e interpretando de forma restrictiva las causas de inadmisión y aquellos límites, con el fin de favorecer el control de la actividad pública por la ciudadanía.",
      "C - En la gestión cotidiana de su actividad profesional, las y los empleados públicos forales trabajarán a través de las metas y objetivos enmarcados en el Plan Estratégico de gestión de cada mandato, así como mediante el cumplimiento de los indicadores establecidos para poder evaluar los resultados de su gestión.",
      "D - En su actividad profesional utilizarán preferentemente el euskera tanto oralmente como por escrito, salvo en aquellos actos o relaciones en los que quienes sean sus interlocutores no tengan un conocimiento suficiente de la lengua vasca."
    ],
    "correct": 2
  },
  {
    "question": "Según la Ley 10/1982, ¿qué consideración tiene el euskera?",
    "options": [
      "A - Es la lengua secundaria de la Comunidad Autónoma.",
      "B - Es la lengua propia del Pueblo Vasco.",
      "C - Es una lengua de uso meramente literario.",
      "D - Es la lengua oficial única del territorio."
    ],
    "correct": 1
  },
  {
    "question": "Según la Ley 10/1982, ¿cómo califica el artículo 3 el estatus del euskera en la Comunidad Autónoma?",
    "options": [
      "A - Lengua cooficial opcional.",
      "B - Lengua oficial, al igual que el castellano.",
      "C - Lengua de interés cultural preferente.",
      "D - Lengua administrativa exclusiva."
    ],
    "correct": 1
  },
  {
    "question": "¿Qué derecho reconoce el artículo 5 de la Ley 10/1982 a todos los ciudadanos del País Vasco?",
    "options": [
      "A - El derecho a conocer y usar las dos lenguas oficiales.",
      "B - El derecho a recibir subvenciones para aprender euskera.",
      "C - El derecho a elegir una tercera lengua en la Administración.",
      "D - El derecho a ser atendido en cualquier lengua que elijan en la Administración."
    ],
    "correct": 0
  },
  {
    "question": "Según la Ley 10/1982, ¿cómo debe ir redactado todo acto en el que intervengan los poderes públicos sitos en la Comunidad Autónoma del País Vasco, así como las notificaciones y comunicaciones administrativas?",
    "options": [
      "A - Deberán ir redactados en forma euskera, salvo que los interesados privados elijan expresamente la utilización de otro idioma.",
      "B - Deberán ir redactados en forma castellano, salvo que los interesados privados elijan expresamente la utilización del euskera.",
      "C - Deberán ir redactados en forma bilingüe, salvo que los interesados privados elijan expresamente la utilización de una de las lenguas oficiales de la Comunidad Autónoma.",
      "D - Deberán ir redactados en forma bilingüe, en todo caso."
    ],
    "correct": 2
  },
  {
    "question": "Según la Ley 10/1982, en sus relaciones con la Administración de Justicia:",
    "options": [
      "A - Todo ciudadano deberá utilizar la lengua oficial elegida por los jueces.",
      "B - Todo ciudadano podrá utilizar la lengua oficial de su elección, aunque se le podrá exigir realizar traducciones en caso de ser necesarios.",
      "C - Todo ciudadano podrá utilizar la lengua oficial de su elección, sin que se le pueda exigir traducción alguna, salvo en determinadas materias donde por su dificultad resulte necesario exigir la traducción de escritos y documentos de carácter técnico.",
      "D - Todo ciudadano podrá utilizar la lengua oficial de su elección, sin que se le pueda exigir traducción alguna."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${preguntaActual + 1}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
