<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 7 (89 - 102)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 7 <span class="rango-test">(89 - 102)</span></h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Según la Norma Foral 6/2005, las Normas Forales:",
    "options": [
      "A - Serán publicadas en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 10 días de su publicación en aquel, salvo disposición en contrario.",
      "B - Las Normas Forales serán publicadas en el Boletín Oficial de Gipuzkoa, en el Boletín Oficial del País Vasco y en el Boletín Oficial del Estado y entrarán en vigor a los 10 días de su publicación en aquel, salvo disposición en contrario.",
      "C - Las Normas Forales serán publicadas en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 20 días de su publicación en aquel, salvo disposición en contrario.",
      "D - Las Normas Forales serán publicadas en el Boletín Oficial de Gipuzkoa, en el Boletín Oficial del País Vasco y en el Boletín Oficial del Estado y entrarán en vigor a los 20 días de su publicación en aquel, salvo disposición en contrario."
    ],
    "correct": 2
  },
  {
    "question": "Según la Norma Foral 6/2005, se regularán mediante Norma Foral:",
    "options": [
      "A - Los Presupuestos del Territorio Histórico y sus cuentas generales.",
      "B - Las áreas de actuación y funciones de los Departamentos Forales.",
      "C - Los planes territoriales, planes urbanísticos supramunicipales y el planeamiento general urbanístico municipal.",
      "D - Los planes de empleo y la oferta de empleo público de la Diputación Foral."
    ],
    "correct": 0
  },
  {
    "question": "Según la Norma Foral 6/2005, señale la respuesta correcta respecto a las Juntas Generales:",
    "options": [
      "A - Las Juntas Generales de Gipuzkoa se regirán en cuanto a su constitución, organización y funcionamiento por lo dispuesto en su Reglamento.",
      "B - La Juntas Generales elegirán de entre sus miembros un Presidente o Presidenta y una Mesa, que estará integrada por éste, dos Vicepresidencias, dos Secretarías y dos Diputados o Diputadas Forales, la cual será el órgano rector de la Cámara y ostentará la representación colegiada de ésta en los actos a que asista.",
      "C - La modificación o derogación del Reglamento de Juntas Generales, así como la aprobación de uno nuevo, exigirá mayoría simple de las Juntas Generales en una votación final sobre el conjunto del proyecto.",
      "D - El Reglamento de las Juntas Generales será promulgado por el o la Lehendakari, teniendo el rango y valor de una Ley."
    ],
    "correct": 0
  },
  {
    "question": "Según la Norma Foral 6/2005, las Juntas Generales podrán delegar en la Diputación Foral la potestad de dictar disposiciones normativas con rango de Norma Foral, denominadas:",
    "options": [
      "A - Norma Foral de Bases.",
      "B - Decreto Foral Normativo.",
      "C - Orden Foral.",
      "D - Decreto Foral-Norma."
    ],
    "correct": 1
  },
  {
    "question": "Según la Norma Foral 6/2005, por razones de extraordinaria y urgente necesidad, el Consejo de Gobierno Foral podrá dictar disposiciones normativas provisionales, dentro del ámbito de sus competencias exclusivas, que tomarán la forma de:",
    "options": [
      "A - Norma Foral de Bases.",
      "B - Decreto Foral Normativo.",
      "C - Orden Foral.",
      "D - Decreto Foral-Norma."
    ],
    "correct": 3
  },
  {
    "question": "Según la Norma Foral 6/2005, la Diputación Foral se compone:",
    "options": [
      "A - De junteros y junteras.",
      "B - De la Comisión Permanente y la Junta de Portavoces.",
      "C - Del Diputado o Diputada General y un número de diputadas y diputados forales que no podrá exceder de diez.",
      "D - Del Diputado o Diputada General, de diputadas y diputados forales y de un número de directoras y directores generales que no podrá exceder de diez."
    ],
    "correct": 2
  },
  {
    "question": "Según la Norma Foral 6/2005, la Diputación Foral ostenta la representación legal del Territorio Histórico de Gipuzkoa y en la esfera de sus competencias, asume su gobierno y administración, correspondiéndole:",
    "options": [
      "A - Las funciones normativas.",
      "B - Las funciones normativas, ejecutivas y administrativas, la potestad reglamentaria.",
      "C - Las funciones ejecutivas y administrativas, la potestad reglamentaria y la iniciativa normativa.",
      "D - Las funciones ejecutivas y administrativas, la potestad reglamentaria la iniciativa normativa y aprobar los presupuestos generales del Territorio Histórico."
    ],
    "correct": 2
  },
  {
    "question": "Según la Norma Foral 6/2005, señale la respuesta correcta respecto al Diputado o Diputada General:",
    "options": [
      "A - La elección del Diputado o Diputada General la realizará el Consejo de Gobierno Foral de entre sus miembros de derecho, mediante votación secreta.",
      "B - Para la designación del Diputado o Diputada General será necesario que un candidato o candidata tenga, en primera votación, la mayoría simple de los votos de las y los miembros electos de las Juntas Generales.",
      "C - El acuerdo de nombramiento del Diputado o Diputada General será firmado por el Presidente o Presidenta de las Juntas Generales y publicado en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco.",
      "D - El Diputado o Diputada General asume la presidencia de las Juntas Generales."
    ],
    "correct": 2
  },
  {
    "question": "Según la Norma Foral 6/2005, corresponde al Diputado o Diputada General:",
    "options": [
      "A - Aprobar los Proyectos de Norma Foral para su remisión a las Juntas Generales y determinar su retirada en las condiciones que establezca el Reglamento de las mismas.",
      "B - Ejercer mediante Decretos Forales Normativos la delegación normativa en los términos establecidos en la Norma Foral 6/2005.",
      "C - Resolver los recursos que se interpongan contra los actos del Consejo de Gobierno Foral.",
      "D - Designar y cesar a las diputadas y diputados forales, y asignarles la titularidad de los distintos Departamentos."
    ],
    "correct": 3
  },
  {
    "question": "Según la Norma Foral 6/2005, corresponde al Consejo de Gobierno Foral:",
    "options": [
      "A - Definir el programa de gobierno y llevar su dirección.",
      "B - Aprobar los Decretos Forales-Norma en los supuestos y términos establecidos en la Norma Foral 6/2005.",
      "C - Nombrar, de entre las diputadas y diputados forales, un o una o varios o varias tenientes de Diputado o Diputada General.",
      "D - Resolver en vía administrativa los recursos que se interpongan contra actos y resoluciones dictados por los Diputados o Diputadas Forales."
    ],
    "correct": 1
  },
  {
    "question": "Según la Norma Foral 6/2005, la celebración de las sesiones del Consejo de Gobierno Foral requerirá, para su válida Constitución:",
    "options": [
      "A - La asistencia del Diputado o Diputada General y del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, tres de las y los miembros.",
      "B - La asistencia del Diputado o Diputada General y del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, la mitad de las y los miembros. ·",
      "C - La asistencia del Diputado o Diputada General y del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, dos tercios de las y los miembros.",
      "D - La asistencia del Diputado o Diputada General o del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, dos tercios de las y los miembros."
    ],
    "correct": 1
  },
  {
    "question": "Según la Norma Foral 6/2005, compete a las diputadas y diputados forales:",
    "options": [
      "A - Aprobar el nombramiento y cese de las directoras y directores generales de su Departamento.",
      "B - Resolver en vía administrativa los recursos que se interpongan contra actos y resoluciones dictados por el Consejo de Gobierno Foral en las materias de su competencia.",
      "C - Ejercer la iniciativa de propuesta al Consejo de Gobierno Foral sobre la estructura orgánica y funcional de su Departamento.",
      "D - Aprobar los Decretos Forales en las materias propias del Departamento."
    ],
    "correct": 2
  },
  {
    "question": "Señale la respuesta correcta respecto a las directoras y directores generales según la Norma Foral 6/2005:",
    "options": [
      "A - Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Decreto Foral del Consejo de Gobierno Foral.",
      "B - Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Decreto Foral del Diputado o Diputada General.",
      "C - Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Orden Foral del Diputado o Diputada General.",
      "D - Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Acuerdo del Consejo de Gobierno Foral."
    ],
    "correct": 0
  },
  {
    "question": "Según la Norma Foral 6/2005, los órganos superiores de la Administración Foral son:",
    "options": [
      "A - Los órganos superiores de la Administración Foral son el Consejo de Gobierno Foral, el Diputado o Diputada General, las diputadas y diputados forales y las directoras y directores generales.",
      "B - Los órganos superiores de la Administración Foral son el Consejo de Gobierno Foral, el Diputado o Diputada General, y las diputadas y diputados forales.",
      "C - Los órganos superiores de la Administración Foral son el Consejo de Gobierno Foral y el Diputado o Diputada General.",
      "D - Los órganos superiores de la Administración Foral son el Diputado o Diputada General, y las diputadas y diputados forales."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${preguntaActual + 1}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
