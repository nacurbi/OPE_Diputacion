<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 15 (201 - 214)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 15 <span class="rango-test">(201 - 214)</span></h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Según la Ley 10/1982, señale la respuesta correcta:",
    "options": [
      "A - Los impresos o modelos que hayan de utilizarse por los poderes públicos y privados en la Comunidad Autónoma del País Vasco, deberán estar redactados en forma bilingüe.",
      "B - Los impresos o modelos oficiales que hayan de utilizarse por los poderes públicos en la Comunidad Autónoma del País Vasco, deberán estar redactados en forma bilingüe.",
      "C - Los impresos o modelos que hayan de utilizarse por los poderes públicos y privados en la Comunidad Autónoma del País Vasco, podrán estar redactados, exclusivamente en euskera.",
      "D - Los impresos o modelos oficiales que hayan de utilizarse por los poderes públicos en la Comunidad Autónoma del País Vasco, podrán estar redactados exclusivamente en castellano."
    ],
    "correct": 1
  },
  {
    "question": "¿Qué reconoce el artículo 15 de la Ley 10/1982 a todos los alumnos del País Vasco?",
    "options": [
      "A - El derecho a estudiar en una lengua extranjera de su elección.",
      "B - La obligación de cursar todas las asignaturas en euskera.",
      "C - El derecho a recibir la enseñanza tanto en euskera como en castellano en los diversos niveles educativos.",
      "D - El derecho a no ser evaluado en las asignaturas de lengua."
    ],
    "correct": 2
  },
  {
    "question": "Según la Ley 10/1982, los centros privados subvencionados con fondos públicos que impartan enseñanzas regladas tomando como base una lengua no oficial en la Comunidad:",
    "options": [
      "A - Impartirán como asignaturas obligatorias el euskera y el castellano.",
      "B - Impartirán como asignaturas obligatorias el euskera o el castellano.",
      "C - Impartirán como asignaturas optativas el euskera y el castellano.",
      "D - Impartirán como asignaturas optativas el euskera o el castellano."
    ],
    "correct": 0
  },
  {
    "question": "Según la Ley 10/1982, ¿qué promoverá el Gobierno en los medios de comunicación de la Comunidad Autónoma?",
    "options": [
      "A - El uso del castellano para garantizar la difusión exterior.",
      "B - El empleo exclusivo del euskera a fin de garantizar la equiparación de ambas lenguas.",
      "C - El empleo preferente del euskera a fin de garantizar la equiparación de ambas lenguas.",
      "D - La obligatoriedad de que todos los periodistas sean bilingües."
    ],
    "correct": 2
  },
  {
    "question": "Según la Ley 10/1982, ¿en qué ámbitos de la vida social deben los poderes públicos fomentar el uso del euskera?",
    "options": [
      "A - Únicamente en el ámbito laboral y administrativo.",
      "B - En las actividades mercantiles, culturales, asociativas, deportivas, religiosas y cualesquiera otras.",
      "C - En las actividades mercantiles, culturales, asociativas, deportivas, religiosas y cualesquiera otras en aquellas localidades donde el euskera sea la lengua mayoritaria.",
      "D - En las actividades mercantiles, culturales, asociativas, deportivas, religiosas y cualesquiera otras en aquellas localidades donde el euskera sea la lengua minoritaria."
    ],
    "correct": 1
  },
  {
    "question": "Según la Ley 11/2022, ¿a qué están obligadas las administraciones públicas vascas respecto a las lenguas oficiales?",
    "options": [
      "A - A dar prioridad al euskera en las relaciones externas.",
      "B - A dar prioridad al euskera en las relaciones internas.",
      "C - A utilizar el castellano únicamente cuando el ciudadano lo solicite.",
      "D - A garantizar en sus relaciones, tanto internas como externas, la utilización de ambas."
    ],
    "correct": 3
  },
  {
    "question": "Según la Ley 11/2022, ¿qué instrumento deben aprobar las administraciones públicas vascas para fijar sus objetivos y medidas lingüísticas?",
    "options": [
      "A - Un reglamento orgánico municipal de lenguas.",
      "B - Un instrumento de planificación lingüística.",
      "C - Un catálogo de puestos de bilingüismo obligatorio.",
      "D - Un protocolo de uso interno del euskera."
    ],
    "correct": 1
  },
  {
    "question": "Según la Ley 11/2022, todos los puestos de trabajo existentes en las administraciones públicas vascas, sus instituciones y organismos, incluidos aquellos de naturaleza temporal o coyuntural:",
    "options": [
      "A - Tendrán asignado su correspondiente perfil lingüístico, determinado según las características y necesidades comunicativas atribuidas a dichos puestos de trabajo y a las destrezas lingüísticas exigibles a dicho fin.",
      "B - Tendrán asignado su correspondiente perfil lingüístico, determinado según los conocimientos acreditados por la persona ocupante del puesto.",
      "C - Tendrán asignado su correspondiente perfil lingüístico, determinado según el nivel de conocimiento de euskera de la población en la que tenga sede la administración pública correspondiente.",
      "D - Tendrán asignado un idioma de trabajo, que podrá ser el euskera o el castellano."
    ],
    "correct": 0
  },
  {
    "question": "La asignación del perfil lingüístico a cada uno de los puestos de trabajo existentes en las administraciones públicas vascas, sus instituciones y organismos, así como la de su fecha de preceptividad:",
    "options": [
      "A - Se efectuarán por el departamento del Gobierno Vasco competente en materia de política lingüística.",
      "B - Se efectuarán por sus respectivos órganos de gobierno, previo informe preceptivo de los departamentos de las diputaciones forales competentes en materia de política lingüística.",
      "C - Se efectuarán por sus respectivos órganos de gobierno, previo informe preceptivo del departamento del Gobierno Vasco competente en materia de política lingüística.",
      "D - Se efectuarán por sus respectivos órganos de gobierno, previo informe preceptivo y vinculante de los departamentos de las diputaciones forales competentes en materia de política lingüística."
    ],
    "correct": 2
  },
  {
    "question": "Según la Ley 11/2022, ¿dónde deben quedar incorporados el perfil lingüístico y la fecha de preceptividad de cada uno de los puestos de trabajo existentes en las administraciones públicas vascas?",
    "options": [
      "A - En el expediente del empleado público que ocupa cada puesto.",
      "B - En las relaciones de puestos de trabajo, así como en los instrumentos complementarios recogidos en la ley.",
      "C - En el Plan General de Normalización del Gobierno Vasco.",
      "D - En los Planes Generales de Normalización del Gobierno Vasco y de las diputaciones forales."
    ],
    "correct": 1
  },
  {
    "question": "Según la Ley 11/2022, en los procesos selectivos para el acceso al servicio de las administraciones públicas vascas, cuando el conocimiento del euskera sea mérito:",
    "options": [
      "A - La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al diez por ciento de la puntuación máxima alcanzable en el conjunto del proceso selectivo.",
      "B - La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al veinte por ciento de la puntuación máxima alcanzable en el conjunto del proceso selectivo.",
      "C - La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al diez por ciento de la puntuación máxima alcanzable en la fase de concurso.",
      "D - La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al veinte por ciento de la puntuación máxima alcanzable en la fase de concurso."
    ],
    "correct": 0
  },
  {
    "question": "Según la Ley 11/2022, el único organismo habilitado para la acreditación de perfiles",
    "options": [
      "A - El Instituto de Alfabetización y Reeuskaldunización de Adultos (HABE).",
      "B - El Instituto Vasco de Administración Pública.",
      "C - La Escuela Oficial de Idiomas.",
      "D - El Gobierno Vasco."
    ],
    "correct": 1
  },
  {
    "question": "Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, el perfil lingüístico determina:",
    "options": [
      "A - El nivel de competencia lingüística en comprensión oral en euskera necesario para la provisión y desempeño del puesto de trabajo.",
      "B - El nivel de competencia lingüística en comprensión escrita en euskera necesario para la provisión y desempeño del puesto de trabajo.",
      "C - El conjunto de los niveles de competencia lingüística en euskera y castellano necesarios para la provisión y desempeño del puesto de trabajo.",
      "D - El conjunto de los niveles de competencia lingüística en euskera necesarios para la provisión y desempeño del puesto de trabajo."
    ],
    "correct": 3
  },
  {
    "question": "Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, cuando la fecha de preceptividad esté vencida en la relación de puestos de trabajo de la entidad:",
    "options": [
      "A - El cumplimiento del perfil lingüístico se constituirá como exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo.",
      "B - El cumplimiento del perfil lingüístico se constituirá como exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo en el plazo de un año desde la fecha de preceptividad.",
      "C - El cumplimiento del perfil lingüístico se constituirá como exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo en el plazo de dos años desde la fecha de preceptividad.",
      "D - El cumplimiento del perfil lingüístico dejará de ser exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${preguntaActual + 1}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
