<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 6 (75 - 88)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 6 <span class="rango-test">(75 - 88)</span></h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Según el Estatuto de Autonomía para el País Vasco, ¿en qué materia tiene competencia exclusiva la Comunidad Autónoma del País Vasco?",
    "options": [
      "A - Medio ambiente y ecología.",
      "B - Ordenación del crédito, banca y seguros.",
      "C - Asistencia social.",
      "D - Régimen minero y energético."
    ],
    "correct": 2
  },
  {
    "question": "Según el Estatuto de Autonomía para el País Vasco, ¿en cuál de las siguientes materias le corresponde a la Comunidad Autónoma del País Vasco la ejecución de la legislación del Estado?",
    "options": [
      "A - Ordenación del territorio y del litoral, urbanismo y vivienda.",
      "B - Turismo y deporte.",
      "C - Propiedad intelectual e industrial.",
      "D - Espectáculos."
    ],
    "correct": 2
  },
  {
    "question": "Señale la respuesta correcta. La competencia de los órganos jurisdiccionales en el País Vasco se extiende:",
    "options": [
      "A - En el orden civil, a todas las instancias y grados, con excepción de los recursos de casación y de revisión.",
      "B - En el orden penal y social, a todas las instancias y grados, con excepción de los recursos de casación y de revisión.",
      "C - En el orden contencioso-administrativo, a todas las instancias y grados cuando se trate de actos dictados por la Administración del Estado, y, en primera instancia, cuando se trate de actos dictados por la Administración del País Vasco.",
      "D - A las cuestiones de competencia entre órganos judiciales del País Vasco y de las comunidades autónomas limítrofes."
    ],
    "correct": 1
  },
  {
    "question": "Según el Estatuto de Autonomía para el País Vasco, ¿qué le corresponderá al País Vasco en materia de Seguridad Social?",
    "options": [
      "A - El desarrollo legislativo y la ejecución de la legislación básica del Estado, incluso las normas que configuran el régimen económico de la misma.",
      "B - El desarrollo legislativo y la ejecución de las normas que configuran el régimen económico de la Seguridad Social.",
      "C - El desarrollo legislativo y la ejecución de la legislación básica del Estado, salvo las normas que configuran el régimen económico de la misma.",
      "D - La ejecución de la legislación del Estado."
    ],
    "correct": 2
  },
  {
    "question": "Según el Estatuto de Autonomía para el País Vasco, señale la respuesta correcta entre las siguientes opciones:",
    "options": [
      "A - La Comunidad Autónoma podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas. La celebración de los citados convenios, antes de su entrada en vigor, deberá ser comunicada a las Cortes Generales.",
      "B - La Comunidad Autónoma podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas. La celebración de los citados convenios, después de su entrada en vigor, deberá ser comunicada a las Cortes Generales.",
      "C - La Comunidad Autónoma podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas. La celebración de los citados convenios, antes de su entrada en vigor, deberá ser comunicada al Gobierno de España.",
      "D - La Comunidad Autónoma no podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas."
    ],
    "correct": 0
  },
  {
    "question": "Según el Estatuto de Autonomía del País Vasco, los poderes del País Vasco se ejercerán a través:",
    "options": [
      "A - Del Parlamento, del Gobierno y de su Presidente o Lendakari.",
      "B - Del Parlamento, y del Gobierno.",
      "C - Del Parlamento, y del Presidente o Lendakari.",
      "D - Del Parlamento."
    ],
    "correct": 0
  },
  {
    "question": "Según el Estatuto de Autonomía del País Vasco, el Parlamento Vasco:",
    "options": [
      "A - Ejerce la potestad ejecutiva, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco.",
      "B - Ejerce la potestad ejecutiva, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco y las diputaciones forales.",
      "C - Ejerce la potestad legislativa, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco.",
      "D - Ejerce la potestad legislativa, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco y las diputaciones forales."
    ],
    "correct": 2
  },
  {
    "question": "Según el Estatuto de Autonomía para el País Vasco, señale la respuesta correcta sobre el Parlamento Vasco:",
    "options": [
      "A - Estará integrado por un número igual de representantes de cada Territorio Histórico elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral es el Territorio Histórico y será elegido por un período de cuatro años.",
      "B - Estará integrado por un número proporcional de representantes de cada Territorio Histórico en función del número de habitantes, elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral es el Territorio Histórico y será elegido por un período de cuatro años.",
      "C - Estará integrado por un número igual de representantes de cada circunscripción electoral elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral son las comarcas de cada territorio histórico y será elegido por un período de cuatro años.",
      "D - Estará integrado por un número igual de representantes de cada Territorio Histórico elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral es el Territorio Histórico y será elegido por un período de cinco años."
    ],
    "correct": 0
  },
  {
    "question": "Según el Estatuto de Autonomía del País Vasco, ¿qué órgano colegiado ostenta las funciones ejecutivas y administrativas del País Vasco?",
    "options": [
      "A - El Parlamento Vasco.",
      "B - El Gobierno Vasco.",
      "C - El Departamento de Lehendakaritza.",
      "D - La comisión ejecutiva del Parlamento Vasco."
    ],
    "correct": 1
  },
  {
    "question": "Según el Estatuto de Autonomía para el País Vasco, señale la respuesta correcta:",
    "options": [
      "A - El Gobierno Vasco cesa tras la celebración de elecciones del Parlamento, en el caso de pérdida de la confianza parlamentaria o por dimisión o fallecimiento de su Presidente o Consejeros.",
      "B - El Gobierno cesante continuará en funciones hasta la celebración de nuevas elecciones.",
      "C - El Presidente del Gobierno Vasco será designado de entre sus miembros por el Parlamento Vasco y nombrado por el Presidente del Gobierno de España.",
      "D - El Presidente designa y separa los Consejeros del Gobierno, dirige su acción, ostentando a la vez la más alta representación del País Vasco y la ordinaria del Estado en este territorio."
    ],
    "correct": 3
  },
  {
    "question": "Los conflictos de competencia que se puedan suscitar entre las Instituciones de la Comunidad Autónoma y las de cada uno de sus Territorios Históricos se someterán a la decisión de:",
    "options": [
      "A - Una comisión arbitral, formada por un número igual de representantes designados libremente por el Gobierno Vasco y por la Diputación Foral del Territorio interesado, y presidida por el Presidente del Tribunal Superior de Justicia del País Vasco.",
      "B - Una comisión arbitral, formada por un número igual de representantes designados libremente por el Gobierno Vasco y por la Diputación Foral del Territorio interesado, y presidida por el Presidente del Tribunal Supremo.",
      "C - El Senado.",
      "D - El Parlamento Vasco."
    ],
    "correct": 0
  },
  {
    "question": "De acuerdo con su tradición histórica, son Instituciones y Órganos Forales del Territorio Histórico de Gipuzkoa:",
    "options": [
      "A - Las Juntas Generales.",
      "B - La Diputación Foral y los Ayuntamientos de Gipuzkoa.",
      "C - Las Juntas Generales y la Diputación Foral.",
      "D - Las Juntas Generales, la Diputación Foral y los Ayuntamientos de Gipuzkoa."
    ],
    "correct": 2
  },
  {
    "question": "Señale la respuesta correcta. Según la Norma Foral 6/2005:",
    "options": [
      "A - Las Juntas Generales, que constituyen el Órgano máximo de representación y participación popular del Territorio Histórico, son el Parlamento de Gipuzkoa.",
      "B - Las Juntas Generales están compuestos por el Diputado General o la Diputada General y los Diputados Forales o las Diputadas Forales.",
      "C - A efectos de elección a las Juntas Generales, la única circunscripción electoral es el Territorio Histórico de Gipuzkoa.",
      "D - Las Juntas Generales ejercen la potestad normativa en los términos establecidos en la presente Norma Foral, evalúan los resultados de dicha potestad, eligen a los Diputados Forales o a las Diputadas Forales, aprueban sus presupuestos y, a iniciativa de la Diputación Foral, los del Territorio Histórico, y controlan la acción de aquélla."
    ],
    "correct": 0
  },
  {
    "question": "Las disposiciones emanadas de las Juntas Generales en virtud de su potestad normativa se denominan:",
    "options": [
      "A - Leyes Orgánicas Forales.",
      "B - Normas Forales.",
      "C - Decretos Forales.",
      "D - Ordenes Forales."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${preguntaActual + 1}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
