<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 8 (103 - 116)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 8 <span class="rango-test">(103 - 116)</span></h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Según la Norma Foral 6/2005, señale la respuesta correcta sobre los Departamentos de la Diputación Foral de Gipuzkoa:",
    "options": [
      "A - Toda variación en el número, denominación y competencias de los Departamentos y la creación, fusión, supresión y reforma de los mismos se establecerá por Decreto Foral del Consejo de Gobierno Foral.",
      "B - En cada Departamento habrá una Secretaría Técnica que tendrá atribuidas las competencias sobre servicios comunes que determine el Decreto Foral de estructura orgánica de aquel, y en todo caso ejercerá las funciones genéricas de Secretaría y asesoramiento jurídico en las materias propias del Departamento y las de control de legalidad y control del gasto de los Órganos del Departamento. ·",
      "C - Corresponde al Diputado o Diputada Foral correspondiente, conjuntamente con el diputado o diputada foral que tenga atribuidas las competencias en materia de organización y servicios generales, la aprobación de la estructura orgánica de cada uno de los Departamentos mediante Orden Foral.",
      "D - Los Departamentos estarán bajo la superior dirección de un director o directora general."
    ],
    "correct": 1
  },
  {
    "question": "Según la Norma Foral 6/2005, las disposiciones de carácter general de la Diputación Foral adoptarán la siguiente forma:",
    "options": [
      "A - Decretos Forales del Consejo de Gobierno Foral y del Diputado o Diputada General y Ordenes Forales, dictadas por las diputadas y diputados forales titulares de los Departamentos.",
      "B - Acuerdos del Consejo de Gobierno Foral, Decretos Forales del Diputado o Diputada General y Ordenes Forales, dictadas por las diputadas y diputados forales titulares de los Departamentos.",
      "C - Acuerdos del Consejo de Gobierno Foral y Ordenes Forales del Diputado o Diputada General y de las diputadas y diputados forales titulares de los Departamentos.",
      "D - Decretos Forales del Consejo de Gobierno Foral y Ordenes Forales del Diputado o Diputada General y de las diputadas y diputados forales titulares de los Departamentos."
    ],
    "correct": 0
  },
  {
    "question": "Según la Norma Foral, 6/2005, todas las disposiciones de carácter general:",
    "options": [
      "A - Se publicarán en el Boletín Oficial de Gipuzkoa y entrarán en vigor a los 15 días de su publicación, salvo disposición en contrario.",
      "B - Se publicarán en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 15 días de su publicación, salvo disposición en contrario.",
      "C - Se publicarán en el Boletín Oficial de Gipuzkoa y entrarán en vigor a los 20 días de su publicación, salvo disposición en contrario.",
      "D - Se publicarán en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 20 días de su publicación, salvo disposición en contrario."
    ],
    "correct": 2
  },
  {
    "question": "Según la Norma Foral, 6/2005, los actos del Consejo de Gobierno Foral adoptarán la forma de:",
    "options": [
      "A - Acuerdo.",
      "B - Decreto Foral.",
      "C - Orden Foral.",
      "D - Resolución."
    ],
    "correct": 0
  },
  {
    "question": "Según la Norma Foral, 6/2005, las resoluciones del Diputado o Diputada General adoptarán la forma de:",
    "options": [
      "A - Acuerdo.",
      "B - Decreto Foral.",
      "C - Orden Foral.",
      "D - Resolución."
    ],
    "correct": 1
  },
  {
    "question": "Según la Norma Foral, 6/2005, las resoluciones de las diputadas y diputados forales adoptarán la forma de:",
    "options": [
      "A - Acuerdo.",
      "B - Decreto Foral.",
      "C - Orden Foral.",
      "D - Resolución."
    ],
    "correct": 2
  },
  {
    "question": "Según la Norma Foral, 6/2005, los actos dictados por las directoras y directores generales adoptarán la forma de:",
    "options": [
      "A - Acuerdo.",
      "B - Decreto Foral.",
      "C - Orden Foral.",
      "D - Resolución."
    ],
    "correct": 3
  },
  {
    "question": "Según la Norma Foral, 6/2005, las resoluciones dictadas por las diputadas y diputados forales:",
    "options": [
      "A - No ponen fin a la vía administrativa.",
      "B - Ponen fin a la vía administrativa.",
      "C - No ponen fin a la vía administrativa, salvo que se señale lo contrario en la propia resolución.",
      "D - Ponen fin a la vía administrativa, salvo que se señale lo contrario en la propia resolución."
    ],
    "correct": 1
  },
  {
    "question": "De acuerdo con la Ley 39/2015, los procedimientos:",
    "options": [
      "A - Se iniciarán siempre de oficio.",
      "B - Se iniciarán siempre a solicitud del interesado.",
      "C - Podrán iniciarse de oficio o a solicitud del interesado.",
      "D - Podrán iniciarse de oficio o a solicitud de los interesados, cuando el número de interesados sea significativo."
    ],
    "correct": 2
  },
  {
    "question": "Iniciado el procedimiento, el órgano administrativo competente para resolver:",
    "options": [
      "A - Podrá adoptar, únicamente de oficio y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, si existiesen elementos de juicio suficientes para ello, de acuerdo con los principios de proporcionalidad, efectividad y menor onerosidad.",
      "B - Podrá adoptar, de oficio o a instancia de parte y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, si existiesen elementos de juicio suficientes para ello, de acuerdo con los principios de proporcionalidad, efectividad y menor onerosidad.",
      "C - Podrá adoptar, únicamente de oficio y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, con independencia de que existiesen elementos de juicio suficientes para ello.",
      "D - Podrá adoptar, de oficio o a instancia de parte y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, con independencia de que existiesen elementos de juicio suficientes para ello."
    ],
    "correct": 1
  },
  {
    "question": "Antes de la iniciación del procedimiento administrativo, el órgano competente para iniciar o instruir el procedimiento, de oficio o a instancia de parte, podrá adoptar de forma motivada las medidas provisionales que resulten necesarias y proporcionadas:",
    "options": [
      "A - En los casos de urgencia inaplazable y para la protección provisional de los intereses implicados.",
      "B - En todos los casos.",
      "C - Solo en los procedimientos sancionadores.",
      "D - Solo en los procedimientos de responsabilidad patrimonial."
    ],
    "correct": 0
  },
  {
    "question": "No se podrán adoptar medidas provisionales:",
    "options": [
      "A - Que puedan causar perjuicio de difícil o imposible reparación a los interesados o que impliquen violación de derechos amparados por las leyes.",
      "B - Cuando así lo solicite la persona interesada.",
      "C - Cuando el plazo para la resolución del procedimiento sea menor a 1 año.",
      "D - Cuando otras administraciones públicas puedan ser afectadas por las medidas a adoptar y muestren su disconformidad en un plazo de 10 días"
    ],
    "correct": 0
  },
  {
    "question": "Señale la respuesta correcta. Los procedimientos se iniciarán de oficio por acuerdo del órgano competente:",
    "options": [
      "A - Exclusivamente por propia iniciativa o como consecuencia de orden superior.",
      "B - Exclusivamente por propia iniciativa o a petición de otros órganos.",
      "C - Bien por propia iniciativa o como consecuencia de orden superior, a petición de otros órganos o por denuncia.",
      "D - Bien por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia."
    ],
    "correct": 3
  },
  {
    "question": "Según la Ley 39/2015, se entiende por propia iniciativa:",
    "options": [
      "A - La actuación derivada del conocimiento directo o indirecto de las circunstancias, conductas o hechos objeto del procedimiento por el órgano que tiene atribuida la competencia de iniciación.",
      "B - La actuación derivada del conocimiento directo de las circunstancias, conductas o hechos objeto del procedimiento por el órgano que tiene atribuida la competencia de iniciación.",
      "C - La actuación derivada del conocimiento indirecto de las circunstancias, conductas o hechos objeto del procedimiento por el órgano que tiene atribuida la competencia de iniciación.",
      "D - La orden emitida por el órgano administrativo inmediatamente superior jerárquico del competente para la iniciación del procedimiento."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${preguntaActual + 1}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
