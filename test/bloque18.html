<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 18 (243 - 256)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
            line-height: 1.2;
            margin: 0 0 -14px 0;
            text-align: center;
        }
        .titulo-test .rango-test {
            font-size: 0.7em;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 0 20px 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: -14px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 18 <span class="rango-test">(243 - 256)</span></h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Según el principio general “Participación” de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, ¿qué deben impulsar los poderes públicos vascos en el desarrollo de las políticas públicas?",
    "options": [
      "A - La participación exclusiva de las administraciones públicas.",
      "B - La participación e interlocución de los grupos feministas y de mujeres, de los agentes sociales y de la ciudadanía en su conjunto.",
      "C - La participación de expertos técnicos.",
      "D - La participación mayoritaria de las mujeres."
    ],
    "correct": 1
  },
  {
    "question": "Según el principio general “Innovación, transparencia y rendición de cuentas” de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, los poderes públicos vascos deben:",
    "options": [
      "A - Frenar la innovación y la mejora continua de las políticas de igualdad hasta que se garantice el cumplimiento de las mismas y garantizar la transparencia y la rendición de cuentas a la ciudadanía sobre cómo se contribuye a la igualdad de mujeres y hombres a través de los recursos públicos.",
      "B - Fomentar la innovación y la mejora continua de las políticas de igualdad y garantizar la transparencia y la rendición de cuentas a la ciudadanía sobre cómo se contribuye a la igualdad de mujeres y hombres a través de los recursos públicos.",
      "C - Fomentar la innovación y la mejora continua de las políticas de igualdad y garantizar la transparencia y la rendición de cuentas a la ciudadanía sobre cómo se contribuye a la igualdad de mujeres y hombres a través de los recursos privados.",
      "D - Fomentar la innovación y la mejora continua de las entidades privadas en relación a las políticas de igualdad y garantizar la transparencia y la rendición de cuentas a los poderes públicos."
    ],
    "correct": 1
  },
  {
    "question": "En relación al principio general protección de los derechos lingüísticos y promoción del uso del euskera, ¿qué deben asegurar los poderes públicos en el desarrollo de políticas de igualdad?",
    "options": [
      "A - Que los servicios se presten en la lengua cooficial elegida por la persona interesada.",
      "B - Que los servicios se presten únicamente en euskera.",
      "C - Que los servicios se presten únicamente en castellano.",
      "D - Que los servicios se presten en cualquier lengua elegida por la persona interesada."
    ],
    "correct": 0
  },
  {
    "question": "¿Cuál es el fin último de la Norma Foral 2/2015, de 9 de marzo, para la igualdad de mujeres y hombres?",
    "options": [
      "A - Establecer exclusivamente el régimen sancionador en materia de discriminación por razón de sexo.",
      "B - Garantizar las condiciones necesarias para la consecución de la igualdad real y efectiva de mujeres y hombres en todos sus ámbitos de actuación, a fin de contribuir a la construcción de un modelo de organización social en el Territorio de Gipuzkoa que coloque la sostenibilidad de la vida en el centro de las políticas públicas de la Diputación Foral de Gipuzkoa.",
      "C - Regular únicamente la estructura interna de la Dirección de Igualdad de la Diputación Foral de Gipuzkoa.",
      "D - Promover la autonomía de las mujeres exclusivamente en el ámbito laboral y de la empresa privada."
    ],
    "correct": 1
  },
  {
    "question": "De acuerdo con la Norma Foral 2/2015, de 9 de marzo, para la igualdad de mujeres y hombres, ¿a cuál de las siguientes entidades NO se le aplica esta Norma Foral?",
    "options": [
      "A - A las fundaciones del sector público foral del Territorio Histórico de Gipuzkoa, que se definan como tal en la normativa que les sea aplicable.",
      "B - A las sociedades mercantiles forales.",
      "C - A las empresas privadas que no tengan contratos vigentes con la Administración Foral.",
      "D - A los organismos autónomos forales y entidades públicas empresariales forales."
    ],
    "correct": 2
  },
  {
    "question": "De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿a qué entidades privadas les son de aplicación los principios generales de igualdad?",
    "options": [
      "A - A todas las entidades privadas con sede social en el Territorio Histórico de Gipuzkoa.",
      "B - Únicamente a aquellas entidades privadas que tengan más de 50 trabajadores en plantilla.",
      "C - A las entidades privadas que suscriban contratos, convenios de colaboración o sean beneficiarias de ayudas o subvenciones de los poderes públicos forales.",
      "D - Las entidades privadas están exentas de cumplir estos principios, ya que solo afectan al sector público foral."
    ],
    "correct": 2
  },
  {
    "question": "De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿cuál de las siguientes tareas corresponde a la Diputación Foral de Gipuzkoa para garantizar la igualdad de mujeres y hombres?",
    "options": [
      "A - La aprobación de leyes orgánicas en materia de violencia de género.",
      "B - La ejecución de medidas de acción positiva en su ámbito territorial.",
      "C - El análisis de estudios e investigaciones sobre la situación de mujeres y hombres encargados al Gobierno Vasco.",
      "D - El establecimiento de medidas de fomento a fin de exigir a los ayuntamientos y demás entidades locales que dediquen recursos materiales, económicos y personales para el desarrollo de programas y actividades dirigidas a la consecución de la igualdad de mujeres y hombres."
    ],
    "correct": 1
  },
  {
    "question": "La organización de la Diputación Foral de Gipuzkoa en materia de igualdad de mujeres y hombres estará conformada por:",
    "options": [
      "A - El Órgano para la Igualdad de Mujeres y Hombres, las unidades departamentales para la igualdad de mujeres y hombres, las estructuras de coordinación interdepartamental de carácter político y de carácter técnico y las estructuras de coordinación intradepartamental de carácter político y de carácter técnico.",
      "B - El Órgano para la Igualdad de Mujeres y Hombres, las unidades departamentales para la igualdad de mujeres y hombres y las estructuras de coordinación interdepartamental de carácter político y de carácter técnico.",
      "C - El Órgano para la Igualdad de Mujeres y Hombres y las unidades departamentales para la igualdad de mujeres y hombres.",
      "D - El Órgano para la Igualdad de Mujeres y Hombres."
    ],
    "correct": 0
  },
  {
    "question": "De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿cuál es la configuración y el ámbito exclusivo de actuación del Órgano para la Igualdad de Mujeres y Hombres?",
    "options": [
      "A - Se configura como un organismo autónomo cuyo ámbito es la gestión de subvenciones en materia de género.",
      "B - Se configura como un órgano de carácter transversal cuyo ámbito exclusivo de actuación será garantizar el impulso de las políticas forales en materia de igualdad de mujeres y hombres.",
      "C - Se configura como una unidad administrativa consultiva cuyo ámbito es la inspección de las empresas privadas de Gipuzkoa.",
      "D - Se configura como un departamento independiente cuyo ámbito exclusivo es la atención a víctimas de discriminación."
    ],
    "correct": 1
  },
  {
    "question": "Señale cual es una de las funciones de las unidades departamentales para la igualdad de mujeres y hombres ejercerán, en cumplimiento de los criterios y bajo la coordinación del Órgano para Igualdad de Mujeres y Hombres:",
    "options": [
      "A - Velar por la aplicación efectiva del principio de igualdad de mujeres y hombres dentro de su respectivo departamento, y en los organismos autónomos, entidades públicas empresariales y sociedades mercantiles forales en su caso adscritos al mismo.",
      "B - Asistir a los órganos del su departamento y, en su caso, a los órganos de los organismos autónomos, entidades públicas empresariales y de las sociedades mercantiles forales adscritas al mismo, en la atención, prevención, actuación y eliminación de posibles situaciones de discriminación que se produzcan en el ámbito de sus organizaciones.",
      "C - Diseñar e impulsar medidas específicas de acción positiva en las áreas de actuación de su departamento y en su caso, de los organismos autónomos, entidades públicas empresariales y de las sociedades mercantiles forales adscritas al mismo.",
      "D - Las tres opciones anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "Las estructuras de coordinación y de interlocución social para la igualdad de mujeres y hombres están formados por:",
    "options": [
      "A - Estructuras de coordinación interdepartamental para la igualdad de mujeres y hombres, estructuras de coordinación intradepartamental para la igualdad de mujeres y hombres y estructuras de interlocución social para la igualdad de mujeres y hombres.",
      "B - Estructuras de coordinación interdepartamental para la igualdad de mujeres y hombres y estructuras de coordinación intradepartamental para la igualdad de mujeres y hombres.",
      "C - Estructuras de coordinación interdepartamental para la igualdad de mujeres y hombres y estructuras de interlocución social para la igualdad de mujeres y hombres.",
      "D - Estructuras de coordinación intradepartamental para la igualdad de mujeres y hombres y estructuras de interlocución social para la igualdad de mujeres y hombres."
    ],
    "correct": 0
  },
  {
    "question": "De acuerdo con la Norma Foral 2/2015, de 9 de marzo, la Diputación Foral de Gipuzkoa garantizará la capacitación especializada en materia de igualdad de mujeres y hombres de:",
    "options": [
      "A - Todo el personal.",
      "B - Los y las jefes y jefas de servicio.",
      "C - Los y las jefes y jefas de servicio, los y las jefes y jefas de sección y el personal técnico de igualdad.",
      "D - El personal técnico de igualdad."
    ],
    "correct": 3
  },
  {
    "question": "El órgano competente de la Diputación Foral de Gipuzkoa para el desarrollo de las políticas específicas para la igualdad de mujeres y hombres será:",
    "options": [
      "A - El Órgano para la Igualdad de Mujeres y Hombres.",
      "B - La Diputada Foral de Cuidados y Políticas Sociales.",
      "C - El Órgano de coordinación interdepartamental de carácter político y de carácter técnico.",
      "D - El Órgano de coordinación intradepartamental de carácter político y de carácter técnico."
    ],
    "correct": 0
  },
  {
    "question": "De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿a qué área de actuación corresponde la promoción del cambio de valores y lucha contra los prejuicios que obstaculizan la participación sociopolítica de las mujeres y otras personas transgresoras del orden heteropatriarcal?",
    "options": [
      "A - El fomento de las políticas públicas locales para la igualdad de mujeres y hombres.",
      "B - Garantizar el apoyo a redes y prácticas feministas.",
      "C - El desarrollo de medidas de sensibilización social, conocimiento y práctica que permitan transitar hacia un modelo de organización socio-económica en igualdad que coloque el cuidado de las personas en el centro.",
      "D - Impulsar la coordinación en el diseño, seguimiento y evaluación de la política foral de lucha contra la violencia machista con el departamento de la Diputación Foral de Gipuzkoa al que se le atribuyen las funciones y competencias en materia de política social, articulada en el marco de la política foral para la igualdad de mujeres y hombres."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${preguntaActual + 1}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);


                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
