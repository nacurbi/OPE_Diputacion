<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPV/EHU – Oferta Pública de Empleo 2023-2024 (GRUPO C1 - ESCALA ADMINISTRATIVA)</title>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .contenedor-principal {
            width: 100%;
            max-width: 1200px;
            padding-top: 52px;
        }

        /* Cabecera: solo el título */
        .encabezado-ope {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 15px 5px;
            border-bottom: 1.5px solid #2b2a7f;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 842px;
            background-color: #F0F0F0;
            z-index: 1000;
        }

        .encabezado-ope .linea-titulo {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            color: #2b2a7f;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        /* Botones del temario en horizontal */
        .lista-indice {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }

        .enlace-bloque {
            display: block;
            padding: 3px 12px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            color: #004085;
            text-decoration: none;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .enlace-bloque:hover {
            background-color: #cce5ff;
            border-color: #2b2a7f;
        }

        /* Botón seleccionado: azul más oscuro */
        .enlace-bloque.activo,
        .enlace-bloque.activo:hover {
            background-color: #2b2a7f;
            border-color: #2b2a7f;
            color: #ffffff;
        }

        .marco-contenido {
            width: 100%;
            max-width: 882px; /* 842 px de la caja + 20 px de margen a cada lado del test */
            height: 80vh;
            display: block;
            margin: 0 auto;
            border: none;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">

        <header class="encabezado-ope">
            <h1 class="linea-titulo">Diputación Foral de Gipuzkoa</h1>
        <nav>
            <ul class="lista-indice">
                <li><a href="Test/Tema1.html" target="marco-contenido" class="enlace-bloque">Tema 1</a></li>
                <li><a href="Test/Tema2.html" target="marco-contenido" class="enlace-bloque">Tema 2</a></li>
                <li><a href="Test/Tema3.html" target="marco-contenido" class="enlace-bloque">Tema 3</a></li>
                <li><a href="Test/Tema4.html" target="marco-contenido" class="enlace-bloque">Tema 4</a></li>
                <li><a href="Test/Tema5.html" target="marco-contenido" class="enlace-bloque">Tema 5</a></li>
                <li><a href="Test/Tema6.html" target="marco-contenido" class="enlace-bloque">Tema 6</a></li>
                <li><a href="Test/Tema7.html" target="marco-contenido" class="enlace-bloque">Tema 7</a></li>
                <li><a href="Test/Tema8.html" target="marco-contenido" class="enlace-bloque">Tema 8</a></li>
                <li><a href="Test/60_Aleatorias.html" target="marco-contenido" class="enlace-bloque">60 Aleatorias</a></li>
            </ul>
        </nav>
        </header>


        <main>
            <iframe id="marco-contenido" name="marco-contenido" class="marco-contenido" title="Contenido del tema" srcdoc="<p style=&quot;font-family:Arial, sans-serif; color:#666; text-align:center; margin-top:40px;&quot;>Selecciona un tema del índice para comenzar el test.</p>"></iframe>
        </main>
    </div>

    <script>
        // Ajusta la altura del iframe según lo que reporta cada test
        window.addEventListener('message', function (event) {
            if (event.data && event.data.tipo === 'alturaContenido') {
                document.getElementById('marco-contenido').style.height = event.data.altura + 'px';
            }
        });

        // Marca el botón pulsado hasta que se pulse otro
        const botones = document.querySelectorAll('.enlace-bloque');
        botones.forEach(function (boton) {
            boton.addEventListener('click', function () {
                botones.forEach(function (b) { b.classList.remove('activo'); });
                boton.classList.add('activo');
            });
        });
    </script>
</body>
</html>
